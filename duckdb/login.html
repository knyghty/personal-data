<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 30rem; margin: 4rem auto; padding: 0 1rem; color: #222; background: #fafafa; }
  button { font: inherit; padding: .7rem 1.2rem; border-radius: .5rem; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
  p.msg { margin-top: 1rem; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } }
</style>
</head>
<body>
<h1>Sign in</h1>
<button id="go">Sign in with passkey</button>
<p class="msg" id="msg"></p>
<script>
const msg = document.getElementById("msg");
document.getElementById("go").onclick = async () => {
  try {
    const options = await (await fetch("/login/options", { method: "POST" })).json();
    const cred = await navigator.credentials.get({ publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(options) });
    const r = await fetch("/login/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cred.toJSON()) });
    const next = new URLSearchParams(location.search).get("next");
    if (r.ok) { location.href = next && next.startsWith("/") && !next.startsWith("//") ? next : "/"; return; }
    msg.textContent = `Failed: ${(await r.json()).error}`;
  } catch (e) {
    msg.textContent = `Failed: ${e.message}`;
  }
};
</script>
</body>
</html>
